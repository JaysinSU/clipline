name: 问题反馈 / Bug report
description: 反馈 Clipline 的问题，并提供复现步骤。
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 描述实际结果和预期结果，附件中请移除私人信息。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本 / macOS version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clipline 版本 / Clipline version
      placeholder: "1.1.2"
  - type: input
    id: screenshot
    attributes:
      label: 截图应用和方式 / Screenshot app and method
      placeholder: 飞书截图后点击完成/复制
